<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:"
    />
    <title>DinoJam</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="app">
      <section id="home" class="screen open home-screen">
        <div class="home-card">
          <div class="home-visual">
            <img src="cover.png" alt="DinoJam" />
            <span class="home-age">5+</span>
          </div>
          <div class="home-content">
            <div id="homeKicker" class="home-kicker"><span>🦖</span> PUZZLE DINO</div>
            <p id="tagline">Liberta os carros e transporta os dinos!</p>
            <div class="home-progress">
              <div class="home-progress-copy">
                <span id="homeLevelLabel">NÍVEL</span>
                <b id="homeProgressText">1 / 200</b>
              </div>
              <div class="home-progress-track"><i id="homeProgressBar"></i></div>
              <small><span>★</span> <b id="homeStars">0</b> / <b id="homeMaxStars">600</b></small>
            </div>
            <button id="play" class="primary"><span>▶</span> JOGAR</button
            ><button id="levelsButton" class="secondary"><span>▦</span> ESCOLHER NÍVEL</button>
          </div>
        </div>
      </section>
      <section id="levels" class="screen">
        <div class="panel levels-panel">
          <button id="closeLevels" class="close">×</button>
          <p class="eyebrow">DINOJAM</p>
          <h1 id="levelsTitle">Escolhe um nível</h1>
          <div id="levelGrid" class="level-grid"></div>
        </div>
      </section>
      <section id="game" class="game-screen">
        <header class="hud">
          <button id="back" class="icon-button">‹</button
          ><button id="settings" class="icon-button">⚙️</button>
          <div class="level-badge">
            <small id="levelWord">NÍVEL</small><b id="levelNumber">1</b>
          </div>
          <div class="score-badge">
            <small id="queueWord">FILA</small><b id="remaining">0</b>
          </div>
          <button id="hint" class="icon-button">💡</button
          ><button id="restart" class="icon-button">↻</button
          ><button id="sound" class="icon-button">🔊</button>
        </header>
        <div id="world" class="world theme-city">
          <div class="scene">
            <span id="sceneIcon">🏙️</span><b id="sceneName">Cidade Dino</b>
          </div>
          <div id="passengerLine" class="passenger-line"></div>
          <div class="boarding">
            <div id="boardingSlots" class="boarding-slots"></div>
            <div class="road-strip"></div>
          </div>
          <div id="parkingBoard" class="parking-board"></div>
        </div>
        <div id="toast" class="toast"></div>
      </section>
      <section id="result" class="screen">
        <div class="panel result-panel">
          <div class="result-hero">
            <img src="assets/sprites/dino-triceratops.png" alt="" />
            <span class="result-sparkles">✦</span>
            <img src="assets/sprites/vehicle-car.png" alt="" />
          </div>
          <div class="result-level-pill"><span id="resultLevelLabel">NÍVEL</span> <b id="resultLevelNumber">1</b></div>
          <p id="resultEyebrow" class="eyebrow">NÍVEL CONCLUÍDO</p>
          <h1 id="resultTitle">Parque resolvido!</h1>
          <div id="stars" class="stars">★★★</div>
          <div class="result-stats">
            <div><small id="finalScoreLabel">Pontuação</small><b id="finalScore">0</b></div>
            <div><small id="resultSceneName">Cidade Dino</small><b id="resultSceneIcon">🏙️</b></div>
          </div>
          <button id="next" class="primary"><span>▶</span> PRÓXIMO NÍVEL</button
          ><button id="retry" class="secondary"><span>↻</span> JOGAR NOVAMENTE</button
          ><button id="resultLevels" class="text-button"><span>▦</span> ESCOLHER NÍVEL</button>
        </div>
      </section>
    </main>
    <script src="sdk/dinoplay-game-sdk.js"></script>
    <script src="game.js"></script>
  </body>
</html>
